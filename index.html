<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Ahmed Faisal 0036">
<title>ADM Inventory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <h2>ADM Inventory</h2><p class="muted">Sign in to continue</p>
    <input id="lEmail" type="email" placeholder="Email" required>
    <input id="lPass" type="password" placeholder="Password" required>
    <p id="lErr" class="err"></p>
    <button class="btn primary">Sign in</button>
  </form>
</div>
<div id="app" class="app">
  <div id="scrim" class="scrim"></div>
  <aside id="side" class="side">
    <div class="brand"><span class="logo">A</span><div><b>ADM Inventory</b><small>Materials register</small></div></div>
    <nav id="nav">
      <a href="#/dashboard">Dashboard</a>
      <a href="#/stock">Stock</a>
      <a href="#/inbound">Inbound</a>
      <a href="#/local">Local purchase</a>
      <a href="#/outbound">Outbound</a>
      <a href="#/register">Monthly register</a>
    </nav>
    <div class="side-foot">
      <button class="btn" data-act="addItem">+ New item</button>
      <button class="btn" id="signout" hidden>Sign out</button>
      <small class="tag">Created by: Ahmed Faisal 0036</small>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon" id="burger" aria-label="Menu">&#9776;</button>
      <h1 id="title"></h1>
      <span id="mode" class="pill"></span>
      <button class="btn primary" data-act="export">Download Excel</button>
      <button class="icon" id="theme" aria-label="Toggle theme"></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
